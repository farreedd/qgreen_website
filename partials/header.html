<header
	class="sticky top-0 z-50 border-b border-qgreen-border bg-white/80 backdrop-blur"
>
	<div
		class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6"
	>
		<a href="./index.html" class="flex items-center gap-3">
			<img
				src="./assets/images/qgreen-logo.png"
				alt="QGreen Analytics logo"
				class="h-9 w-auto"
			/>
			<div class="leading-tight">
				<div class="text-sm font-semibold text-qgreen-blueDark">
					QGreen Analytics
				</div>
				<div class="text-xs text-qgreen-textSecondary">
					AI • Energy • Carbon • Green Finance
				</div>
			</div>
		</a>

		<!-- Desktop nav -->
		<nav class="hidden items-center gap-6 md:flex">
			<a
				id="nav-solutions"
				class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
				href="./solutions.html"
				>Solutions</a
			>
			<a
				id="nav-use-cases"
				class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
				href="./use-cases.html"
				>Use Cases</a
			>
			<a
				id="nav-technology"
				class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
				href="./technology.html"
				>Technology</a
			>
			<a
				id="nav-about"
				class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
				href="./about.html"
				>About</a
			>
			<a
				id="nav-contact"
				class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
				href="./contact.html"
				>Contact</a
			>
		</nav>

		<!-- CTAs -->
		<div class="flex items-center gap-2">
			<!-- Secondary CTA (consistent everywhere; avoids “Explore solutions” on Solutions page) -->
			<a
				id="secondaryCta"
				href="./use-cases.html"
				class="hidden rounded-xl border border-qgreen-border bg-white px-4 py-2 text-sm font-semibold text-qgreen-blueDark hover:border-qgreen-blue/30 hover:bg-qgreen-bgBlue md:inline-flex"
			>
				View use cases
			</a>

			<!-- Primary CTA -->
			<a
				href="./contact.html"
				class="inline-flex rounded-xl bg-qgreen-blue px-4 py-2 text-sm font-semibold text-white shadow-sm hover:opacity-95"
			>
				Request a demo
			</a>

			<!-- Mobile menu button -->
			<button
				id="menuBtn"
				class="ml-1 inline-flex rounded-xl border border-qgreen-border p-2 md:hidden"
				aria-label="Open menu"
			>
				<svg
					class="h-5 w-5 text-qgreen-blueDark"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
				>
					<path d="M4 6h16M4 12h16M4 18h16" />
				</svg>
			</button>
		</div>
	</div>

	<!-- Mobile nav -->
	<div
		id="mobileMenu"
		class="hidden border-t border-qgreen-border bg-white md:hidden"
	>
		<div class="mx-auto max-w-7xl px-4 py-3 sm:px-6">
			<div class="flex flex-col gap-3">
				<a
					id="mnav-solutions"
					class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
					href="./solutions.html"
					>Solutions</a
				>
				<a
					id="mnav-use-cases"
					class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
					href="./use-cases.html"
					>Use Cases</a
				>
				<a
					id="mnav-technology"
					class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
					href="./technology.html"
					>Technology</a
				>
				<a
					id="mnav-about"
					class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
					href="./about.html"
					>About</a
				>
				<a
					id="mnav-contact"
					class="text-sm font-medium text-qgreen-textSecondary hover:text-qgreen-blue"
					href="./contact.html"
					>Contact</a
				>

				<div class="pt-2">
					<a
						href="./contact.html"
						class="inline-flex w-full items-center justify-center rounded-xl bg-qgreen-blue px-4 py-2 text-sm font-semibold text-white shadow-sm hover:opacity-95"
					>
						Request a demo
					</a>
				</div>
			</div>
		</div>
	</div>
</header>
